name: infini_stock
description: IoT-based inventory management system mobile app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.0
  
  # State Management
  provider: ^6.1.0
  
  # API & HTTP
  http: ^1.1.0
  dio: ^5.3.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.0
  image_picker: ^1.0.0
  google_mlkit_barcode_scanning: ^0.14.2
  
  # Share
  share_plus: ^7.2.0
  
  # Date & Time
  intl: ^0.19.0
  
  # Logging
  logger: ^2.0.0

  # Charts (dashboard)
  fl_chart: ^0.69.0
  zxing2: ^0.2.4
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/infocom-logo.png
